name: Update Registry

on:
  repository_dispatch:
    types: [connector-released]

permissions:
  contents: write
  actions: write

concurrency:
  group: update-registry
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Save payload
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: printf '%s' "$PAYLOAD" > "$RUNNER_TEMP/payload.json"

      - name: Update registry entry
        run: ./scripts/update-registry.sh "$RUNNER_TEMP/payload.json" registry.json

      - name: Commit and push
        run: |
          CONNECTOR=$(jq -r .connector "$RUNNER_TEMP/payload.json")
          VERSION=$(jq -r .version "$RUNNER_TEMP/payload.json")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add registry.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "registry: update $CONNECTOR to $VERSION"
          git push

      # A push made with GITHUB_TOKEN starts no push-triggered workflow, so Pages is deployed by dispatch.
      - name: Deploy Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
